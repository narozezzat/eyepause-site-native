name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the EyePause app repo when a release is published (optional).
  repository_dispatch:
    types: [eyepause-release]
  # Daily safety net so a new app release reaches the site even without the dispatch.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Fetch latest EyePause release
        run: npm run fetch-release
        env:
          EYEPAUSE_RELEASES_TOKEN: ${{ secrets.EYEPAUSE_RELEASES_TOKEN }}
          RELEASE_REQUIRED: "true"

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
